name: Generate Pink Pixel Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate pink & pastel-blue snake
        uses: Platane/snk@v3
        with:
          github_user_name: VANSHIKADIXIT16
          outputs: |
            dist/pixel-snake.svg?color_snake=%23AEE2FF&color_dots=%23FFF5F9,%23FFD6E8,%23FFB6D1,%23FF9EC4,%23FF6FA5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
